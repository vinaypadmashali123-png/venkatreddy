<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Venkat Reddy Adda</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#dff1ff;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424}}
:root[data-theme="dark"]{--bg:#0a1424}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg);overflow:hidden}
#stage{position:relative;aspect-ratio:9/16;width:min(100vw,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*9/16));container-type:inline-size;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Lilita One',Impact,sans-serif;color:#fff}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:space-evenly;padding:5cqw 0}
#menu{padding-top:8cqw}
[data-s=menu] #menu,[data-s=over] #over{display:flex}
#over{background:rgba(10,37,70,.74)}
.title{transform:rotate(-7deg);line-height:.88;font-size:15cqw;letter-spacing:.3cqw;-webkit-text-stroke:1.6cqw #12315e;paint-order:stroke fill;text-shadow:0 1.2cqw 0 #12315e}
.title b{display:block;font-weight:400}
.t1{color:#ffc21a;font-size:11cqw}.t2{color:#fff;font-size:20cqw;margin-left:6cqw}
.hero{position:relative;animation:fl 1.5s ease-in-out infinite alternate}
.hero .face{width:25cqw;display:block}
.hero i{position:absolute;left:-15cqw;height:.9cqw;background:#fff;border-radius:1cqw;transform:rotate(-14deg)}
@keyframes fl{to{transform:translateY(-2.5cqw)}}
@media (prefers-reduced-motion:reduce){.hero{animation:none}}
.btn{font-size:9cqw;padding:2.2cqw 10cqw;border-radius:99cqw;border:1cqw solid #12315e;box-shadow:0 1.4cqw 0 #12315e;cursor:pointer;color:#12315e;background:linear-gradient(#ffd93d,#ffaa17)}
.again{color:#fff;font-size:7.5cqw;background:linear-gradient(#ff6b6b,#e63946);border-color:#7a1624;box-shadow:0 1.4cqw 0 #7a1624}
.panel{display:flex;background:rgba(18,49,94,.93);border-radius:4cqw;padding:3cqw 2cqw;font-size:3.8cqw;text-align:center;line-height:1.25}
.panel div{padding:0 5cqw}.panel div+div{border-left:.4cqw solid rgba(255,255,255,.3)}
.panel big{display:block;font-size:7cqw}
.pill{background:rgba(18,49,94,.93);border-radius:3.5cqw;padding:1.6cqw 4cqw;font-size:5.4cqw;white-space:nowrap}
.chip{font-size:3.8cqw;padding:1.6cqw 4cqw;border-radius:99cqw;background:rgba(255,255,255,.85);color:#12315e;cursor:pointer}
.hud{position:absolute;top:3cqw;left:3cqw;right:3cqw;justify-content:space-between;display:none}
[data-s=ready] .hud,[data-s=play] .hud,[data-s=dying] .hud{display:flex}
#over h2{margin:0;font:400 8.2cqw 'Press Start 2P',monospace;color:#ffb81c;text-shadow:.8cqw .8cqw 0 #7a3b0a,-.4cqw -.4cqw 0 #fff2b0}
.card{display:flex;align-items:center;gap:6cqw;background:#f3e3b3;border:1cqw solid #6b4f2a;border-radius:3cqw;padding:4cqw 8cqw 4cqw 5cqw;color:#2a2113;font-family:'Press Start 2P',monospace;text-align:center}
.card .face{width:21cqw}.card b{display:block;font-weight:400;font-size:4.6cqw}.card i{display:block;font-style:normal;font-size:8cqw;margin:2cqw 0 3.5cqw}
#over .call{background:#e63946;color:#fff;font-size:7.4cqw;padding:1.8cqw 5cqw;border:.9cqw solid #fff;border-radius:3cqw;transform:rotate(-2deg);box-shadow:0 1.2cqw 0 rgba(0,0,0,.35);text-align:center}
#over p{margin:0;font:3.6cqw/1.5 'Lilita One',sans-serif;text-align:center}
</style></head>
<body>
<div id="stage" data-s="menu">
<canvas id="c"></canvas>
<div class="hud"><div class="pill" id="sc">SCORE: 0</div><div class="pill" id="bs">BEST: 0</div></div>
<div class="ov" id="menu">
<div class="title"><b class="t1">VENKAT REDDY</b><b class="t2">ADDA</b></div>
<div class="hero"><i style="top:8cqw;width:9cqw"></i><i style="top:14cqw;width:12cqw"></i><i style="top:20cqw;width:9cqw"></i><img class="face" alt=""></div>
<div class="btn">PLAY ▶</div>
<div class="panel"><div><big>⬆️</big>SPACEBAR<br>(or Mouse Click)</div><div><big>📱</big>Tap to Fly<br>(Mobile)</div></div>
<div class="pill" id="mb">⭐ BEST: 0</div>
<label class="chip">📷 Use your own photo<input type="file" accept="image/*" id="pic" hidden></label>
</div>
<div class="ov" id="over">
<h2>GAME OVER</h2>
<div class="call">Come to dean cabin<br>📱 Submit your phones</div>
<div class="card"><img class="face" alt=""><div><b>SCORE</b><i id="fs">0</i><b>BEST</b><i id="fb">0</i></div></div>
<div class="btn again">↻ PLAY AGAIN</div>
<p>SPACEBAR / MOUSE CLICK<br>TO RESTART<br>TAP TO RESTART (MOBILE)</p>
</div>
</div>
<script>
const W=360,H=640,GY=590,PX=110,R=16,PW=60,CH=26,GAP=195,SP=240,G=.42,FL=-7.2;
const $=s=>document.querySelector(s),stage=$('#stage'),cv=$('#c'),ctx=cv.getContext('2d');
const dpr=Math.min(devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
const rnd=(a,b)=>a+Math.random()*(b-a);
let st='menu',score=0,best=0,y=280,vy=0,pipes=[],scroll=0,last=0;
try{best=+localStorage.getItem('cm_best')||0}catch(e){}
// face sprite (default cartoon, or the photo the player picks)
const hc=document.createElement('canvas');hc.width=hc.height=96;
function defFace(){const g=hc.getContext('2d');g.clearRect(0,0,96,96);
const E=(x,y,rx,ry,c)=>{g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill()};
E(21,60,6,7,'#b9764d');E(75,60,6,7,'#b9764d');E(48,58,27,31,'#c0805a');
E(38,56,5,4,'#fff');E(58,56,5,4,'#fff');E(39,56,2.5,2.5,'#222');E(57,56,2.5,2.5,'#222');
E(48,71,11,3.5,'#3a2415');g.strokeStyle='#7a3b2a';g.lineWidth=2;g.beginPath();g.arc(48,76,6,.3,2.8);g.stroke();
g.fillStyle='#1f5fe0';g.beginPath();g.moveTo(17,46);g.bezierCurveTo(17,4,79,4,79,46);g.closePath();g.fill();
E(46,46,38,6,'#174bb5');E(36,24,10,5,'rgba(255,255,255,.28)')}
function setFace(){document.querySelectorAll('.face').forEach(i=>i.src=hc.toDataURL())}
$('#pic').onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();
fr.onload=()=>{const im=new Image();im.onload=()=>{const g=hc.getContext('2d');g.clearRect(0,0,96,96);g.save();g.beginPath();g.arc(48,48,44,0,7);g.clip();
const s=Math.max(96/im.width,96/im.height);g.drawImage(im,48-im.width*s/2,48-im.height*s/2,im.width*s,im.height*s);g.restore();
g.lineWidth=5;g.strokeStyle='#fff';g.beginPath();g.arc(48,48,44,0,7);g.stroke();setFace()};im.src=fr.result};fr.readAsDataURL(f)};
// sound
let ac;function beep(f,d,t='square',v=.04){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
// world
const city=[],bush=[],clouds=[[40,90,1],[240,50,.8],[160,170,.7],[320,260,.9],[60,330,.6]];
for(let x=0;x<720;){const w=rnd(28,56);city.push([x,w,rnd(70,210)]);x+=w+rnd(0,6)}
for(let x=0;x<720;x+=rnd(24,40))bush.push([x,rnd(22,34)]);
function layer(f,fn){const o=-(scroll*f)%720;for(const k of[0,1]){ctx.save();ctx.translate(o+k*720,0);fn();ctx.restore()}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
const AP=['#ff5252','#ffd23f','#3ddc84','#4fc3f7','#b967ff','#ff8a3d'];
function win(x){ctx.fillStyle='#8a5a2b';ctx.fillRect(x,90,90,120);ctx.fillStyle='#bfe6ff';ctx.fillRect(x+6,96,78,108);ctx.fillStyle='#8a5a2b';ctx.fillRect(x+42,96,6,108);ctx.fillRect(x+6,146,78,6)}
function bg(){const s=ctx.createLinearGradient(0,0,0,GY);s.addColorStop(0,'#f6ecd0');s.addColorStop(1,'#e4d1a1');ctx.fillStyle=s;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#8fbfae';ctx.fillRect(0,GY-80,W,80);ctx.fillStyle='#6f9f8e';ctx.fillRect(0,GY-80,W,5);
layer(.3,()=>{ctx.fillStyle='#8a5a2b';ctx.fillRect(24,96,236,124);ctx.fillStyle='#2e5d48';ctx.fillRect(32,104,220,108);ctx.fillStyle='#d9a066';ctx.fillRect(32,212,220,5);
ctx.fillStyle='rgba(255,255,255,.88)';ctx.textAlign='left';ctx.font="24px 'Lilita One',Impact,sans-serif";ctx.fillText('2 + 2 = ?',48,142);ctx.font="16px 'Lilita One',Impact,sans-serif";ctx.fillText('NO PHONES IN CLASS!',48,182);
win(300);win(600);
ctx.fillStyle='#fff';ctx.strokeStyle='#333';ctx.lineWidth=3;ctx.beginPath();ctx.arc(452,122,22,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(452,122);ctx.lineTo(452,108);ctx.moveTo(452,122);ctx.lineTo(463,129);ctx.stroke();
ctx.fillStyle='#ffd23f';ctx.fillRect(500,100,60,80);ctx.fillStyle='#2a2113';ctx.font="22px 'Lilita One',Impact,sans-serif";ctx.fillText('ABC',507,148)});
layer(.8,()=>{for(let x=10;x<720;x+=120){ctx.fillStyle='#c98f52';ctx.fillRect(x,GY-46,76,8);ctx.fillStyle='#7a4f27';ctx.fillRect(x+6,GY-38,5,38);ctx.fillRect(x+65,GY-38,5,38);ctx.fillStyle='#a8713a';ctx.fillRect(x+12,GY-38,52,16);ctx.fillStyle=AP[(x/120|0)%6];ctx.fillRect(x+10,GY-56,22,10)}})}
function ground(){ctx.fillStyle='#b07a42';ctx.fillRect(0,GY,W,H-GY);ctx.fillStyle='#6b4423';ctx.fillRect(0,GY,W,7);
ctx.strokeStyle='rgba(60,35,15,.45)';ctx.lineWidth=2;
[[GY+7,GY+20,0],[GY+20,GY+34,35],[GY+34,H,10]].forEach(([a,b,o])=>{ctx.beginPath();ctx.moveTo(0,b);ctx.lineTo(W,b);for(let x=-((scroll+o)%70);x<W;x+=70){ctx.moveTo(x,a);ctx.lineTo(x,b)}ctx.stroke()})}
function phone(x,y0,y1,top,s){const h=y1-y0;rr(x,y0,PW,h,10);ctx.fillStyle='#15181e';ctx.fill();ctx.strokeStyle='#6b7684';ctx.lineWidth=2.5;ctx.stroke();
const sy=top?y0+4:y0+20,se=top?y1-20:y1-4;ctx.save();rr(x+5,sy,PW-10,se-sy,6);ctx.clip();
const g=ctx.createLinearGradient(0,sy,0,se);g.addColorStop(0,'#1b6ef3');g.addColorStop(1,'#a23dff');ctx.fillStyle=g;ctx.fillRect(x+5,sy,PW-10,se-sy);
for(let r=0;r<30;r++){const yy=top?se-22-r*20:sy+8+r*20;for(let c=0;c<3;c++){ctx.fillStyle=AP[(r*3+c+s)%6];rr(x+10+c*16,yy,12,12,3);ctx.fill()}}
ctx.restore();ctx.fillStyle='#000';rr(x+PW/2-9,top?y1-13:y0+8,18,5,2.5);ctx.fill()}
function drawPipe(p){const a=p.y-GAP/2,b=p.y+GAP/2;phone(p.x,-14,a,true,p.s||0);phone(p.x,b,GY+14,false,p.s||0)}
function drawBird(){const rot=st==='ready'?0:Math.max(-.45,Math.min(vy*.07,1.1));ctx.save();ctx.translate(PX,y);ctx.rotate(rot);
if(st==='play'||st==='ready'){ctx.strokeStyle='rgba(18,49,94,.45)';ctx.lineWidth=2.5;ctx.lineCap='round';[[-34,-9,-48],[-32,0,-52],[-34,9,-46]].forEach(([a,b,c])=>{ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,b);ctx.stroke()})}
ctx.drawImage(hc,-24,-24,48,48);ctx.restore()}
// logic
function setS(s){st=s;stage.dataset.s=s}
function hud(){$('#sc').textContent='SCORE: '+score;$('#bs').textContent='BEST: '+best+' 👑';$('#mb').textContent='⭐ BEST: '+best}
function reset(){pipes=[];score=0;y=280;vy=0;hud();setS('ready')}
function flap(){vy=FL;beep(520,.07)}
function die(){beep(130,.3,'sawtooth',.06);if(score>best){best=score;try{localStorage.setItem('cm_best',best)}catch(e){}}
hud();$('#fs').textContent=score;$('#fb').textContent=best;setS('dying');setTimeout(()=>setS('over'),600)}
function act(){if(st==='menu'||st==='over')reset();else if(st==='ready'){setS('play');flap()}else if(st==='play')flap()}
const hit=(cx,cy,r,x,y,w,h)=>{const dx=cx-Math.max(x,Math.min(cx,x+w)),dy=cy-Math.max(y,Math.min(cy,y+h));return dx*dx+dy*dy<r*r};
function loop(t){const dt=Math.min((t-last)/16.67||1,2.5);last=t;const sp=2.4+Math.min(score*.03,1);
if(st!=='dying'&&st!=='over')scroll+=sp*dt;
clouds.forEach(c=>{c[0]-=.2*c[2]*dt;if(c[0]<-60)c[0]=420});
if(st==='ready')y=280+Math.sin(t/220)*8;
if(st==='play'||st==='dying'||st==='over'){vy=Math.min(vy+G*dt,10);y+=vy*dt;if(y<R){y=R;vy=0}if(st!=='play'&&y>GY-R){y=GY-R;vy=0}}
if(st==='play'){pipes.forEach(p=>p.x-=sp*dt);if(pipes[0]&&pipes[0].x<-PW-10)pipes.shift();
const l=pipes[pipes.length-1];if(!l||l.x<W+30-SP)pipes.push({x:W+30,y:rnd(150,440),p:0,s:Math.random()*6|0});
pipes.forEach(p=>{if(!p.p&&p.x+PW/2<PX){p.p=1;score++;beep(880,.1);hud()}});
if(y>=GY-R||pipes.some(p=>{const a=p.y-GAP/2,b=p.y+GAP/2;return hit(PX,y,R,p.x,-50,PW,a+50)||hit(PX,y,R,p.x,b,PW,H)}))die()}
bg();pipes.forEach(drawPipe);ground();
if(st!=='menu')drawBird();
if(st==='ready'){ctx.font="24px 'Lilita One',Impact,sans-serif";ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#12315e';ctx.fillStyle='#fff';ctx.globalAlpha=.6+.4*Math.sin(t/200);ctx.strokeText('TAP TO FLY',W/2,390);ctx.fillText('TAP TO FLY',W/2,390);ctx.globalAlpha=1}
requestAnimationFrame(loop)}
stage.addEventListener('pointerdown',e=>{if(e.target.closest('label'))return;e.preventDefault();act()});
